    <script>
        (function initExampleCardDemo() {
            const host = document.getElementById('demoCardHost');
            const template = document.getElementById('demoCardTemplate');
            const summary = document.getElementById('demoStateSummary');
            const stateButtons = Array.from(document.querySelectorAll('[data-demo-state]'));
            const stateCopy = {
                pending: '当前状态：提交前选择态。题卡已预选 A，但还没有提交；解析按钮保持禁用。',
                submitted: '当前状态：提交后反馈态。仍然是同一道题，预设错选 A 并已提交，解析已经展开。',
                editor: '当前状态：编辑态。答案键条已显示，你可以直接切换标准答案；切回其他状态会重置题卡。'
            };

            function getCurrentCard() {
                return host.querySelector('.example-card');
            }

            function clickWithin(root, selector) {
                const target = root.querySelector(selector);

                if (!target) {
                    throw new Error(`卡片 ${root.getAttribute('data-card-id') || 'unknown'} 缺少节点 ${selector}`);
                }

                target.click();
                return target;
            }

            function setEditorMode(isActive) {
                document.documentElement.classList.toggle('editor-mode', isActive);
                document.body.classList.toggle('editor-mode', isActive);
            }

            function buildFreshCard() {
                const nextCard = template.content.firstElementChild.cloneNode(true);

                host.replaceChildren(nextCard);

                if (window.ExampleCardRuntime && typeof window.ExampleCardRuntime.initCard === 'function') {
                    window.ExampleCardRuntime.initCard(nextCard);
                }

                return nextCard;
            }

            function updateActiveButton(activeState) {
                stateButtons.forEach(function (button) {
                    const isActive = button.dataset.demoState === activeState;

                    button.classList.toggle('is-active', isActive);
                    button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
                });
            }

            function assertState(state, card) {
                if (!card) {
                    throw new Error('单题体验卡没有正确渲染');
                }

                if (state === 'pending') {
                    if (!card.querySelector('[data-option-value="A"].selected')) {
                        throw new Error('提交前选择态没有保留预选项');
                    }

                    if (card.classList.contains('is-submitted')) {
                        throw new Error('提交前选择态被错误地提交了');
                    }

                    if (!card.querySelector('.example-card__analysis-toggle[disabled]')) {
                        throw new Error('提交前选择态不应解锁解析按钮');
                    }

                    return;
                }

                if (state === 'submitted') {
                    if (!card.querySelector('[data-option-value="A"].result-incorrect')) {
                        throw new Error('提交后反馈态没有出现错误态');
                    }

                    if (!card.querySelector('[data-option-value="B"].result-correct')) {
                        throw new Error('提交后反馈态没有出现正确态');
                    }

                    if (!card.classList.contains('is-analysis-open')) {
                        throw new Error('提交后反馈态没有保持解析展开');
                    }

                    return;
                }

                if (!document.documentElement.classList.contains('editor-mode')) {
                    throw new Error('编辑态没有进入作者模式类名');
                }

                if (!card.querySelector('.example-card__answer-key[data-answer-value="B"].is-active')) {
                    throw new Error('编辑态的默认正确答案键状态不正确');
                }

                if (window.getComputedStyle(card.querySelector('.example-card__editor-answer-key')).display === 'none') {
                    throw new Error('编辑态没有显示答案键条');
                }
            }

            function applyState(state) {
                const nextState = Object.prototype.hasOwnProperty.call(stateCopy, state) ? state : 'pending';
                const card = buildFreshCard();

                setEditorMode(nextState === 'editor');

                // 这里用“重建同一张题卡 + 最小点击预置”的方式切换状态，
                // 而不是把三张不同题卡并排摆出来。这样用户看到的始终是同一个组件，
                // 只是被重置到不同预设，符合“同一道题体验三种状态”的手测目标。
                if (nextState === 'pending') {
                    clickWithin(card, '[data-option-value="A"]');
                } else if (nextState === 'submitted') {
                    clickWithin(card, '[data-option-value="A"]');
                    clickWithin(card, '.example-card__submit-btn');
                    clickWithin(card, '.example-card__analysis-toggle');
                }

                updateActiveButton(nextState);
                summary.textContent = stateCopy[nextState];
                assertState(nextState, getCurrentCard());
                document.documentElement.dataset.exampleCardDemoState = nextState;
                document.documentElement.dataset.exampleCardDemoReady = 'true';
            }

            try {
                if (!window.ExampleCardRuntime) {
                    throw new Error('ExampleCardRuntime 未加载');
                }

                stateButtons.forEach(function (button) {
                    button.addEventListener('click', function () {
                        try {
                            applyState(button.dataset.demoState);
                        } catch (error) {
                            console.error(error);
                        }
                    });
                });

                applyState('pending');
            } catch (error) {
                console.error(error);
            }
        })();
    </script>
